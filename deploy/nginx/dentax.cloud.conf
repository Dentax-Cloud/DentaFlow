# DentaFlow — reverse proxy to the Docker web container (HTTP only until certbot adds SSL).
# Install: see deploy/setup-https.sh

upstream dentaflow_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name dentax.cloud www.dentax.cloud;

    client_max_body_size 25m;

    location / {
        proxy_pass http://dentaflow_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
