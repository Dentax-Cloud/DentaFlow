<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spine gate labels — verification fixture</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        margin: 0;
        padding: 24px;
      }
      h1 { font-size: 18px; margin: 0 0 16px; }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        margin-bottom: 16px;
        max-width: 720px;
      }
      .header {
        padding: 12px 16px;
      }
      .title { font-size: 14px; font-weight: 600; }
      .summary { margin: 2px 0 0; font-size: 12px; color: #64748b; }
      .section { padding: 12px 16px; }
      .label {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #64748b;
        margin: 0 0 8px;
      }
      button {
        background: #115e59;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 14px;
        opacity: 0.5;
        cursor: not-allowed;
      }
      .note { margin: 6px 0 0; font-size: 12px; color: #92400e; }
      .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .chip {
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 14px;
        ring: 1px solid;
      }
      .chip .k { font-size: 11px; text-transform: uppercase; opacity: 0.7; }
      .ok { background: #ecfdf5; color: #064e3b; box-shadow: inset 0 0 0 1px #a7f3d0; }
      .bad { background: #fff1f2; color: #881337; box-shadow: inset 0 0 0 1px #fecdd3; }
      .wait { background: #fffbeb; color: #78350f; box-shadow: inset 0 0 0 1px #fde68a; }
    </style>
  </head>
  <body>
    <h1>Encounter spine — gate labels (#49)</h1>

    <div class="card" id="collapsed">
      <div class="header">
        <div class="title">Gate summary</div>
        <p class="summary">
          Risk cleared · Consent cleared · Insurance blocked · Sterilization pending
        </p>
      </div>
    </div>

    <div class="card" id="expanded">
      <div class="section">
        <p class="label">Gate summary (expanded)</p>
        <div class="chips">
          <div class="chip ok"><div class="k">Risk</div>CLEARED</div>
          <div class="chip ok"><div class="k">Consent</div>CLEARED</div>
          <div class="chip bad"><div class="k">Insurance</div>BLOCKED</div>
          <div class="chip wait"><div class="k">Sterilization</div>PENDING</div>
        </div>
      </div>
    </div>

    <div class="card" id="status">
      <div class="section">
        <p class="label">Status</p>
        <button type="button" disabled title="Can't move to Procedure Execution yet: Insurance is still blocked">
          → PROCEDURE EXECUTION
        </button>
        <p class="note">Can't move to Procedure Execution yet: Insurance is still blocked</p>
      </div>
    </div>
  </body>
</html>
