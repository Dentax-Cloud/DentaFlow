# TEMPORARY: web/worker share the dev database via external network
# (dentaflow-dev_dentalflow_net) to preserve existing test data.
# This must be split into a fully separate production database/server
# before onboarding real pilot clinics with real patient data.

name: dentaflow

networks:
  dentalflow_net:
    external: true
    name: dentaflow-dev_dentalflow_net

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dentaflow-web-prod
    restart: always
    env_file:
      - .env.production
    ports:
      # Bind to localhost only — nginx on the host terminates TLS on 443.
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    networks:
      - dentalflow_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
