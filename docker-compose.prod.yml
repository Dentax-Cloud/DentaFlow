# Standalone production database, split 2026-10-21 from the database
# previously shared with the dev stack (see
# production-database-split-cursor-prompt.md for the incident writeup and
# migration plan). web/worker now point at dentaflow-db-prod on their own
# dedicated network -- no dependency on the dev stack's network or database
# remains.

name: dentaflow

networks:
  dentalflow_prod_net:
    driver: bridge

volumes:
  prod_postgres_data:

services:
  db:
    image: postgres:16-alpine
    container_name: dentaflow-db-prod
    restart: always
    environment:
      POSTGRES_DB: dentaflow
      POSTGRES_USER: dentaflow
      POSTGRES_PASSWORD: dentaflow
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentaflow -d dentaflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dentalflow_prod_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dentaflow-web-prod
    restart: always
    env_file:
      - .env.production
    ports:
      # Bind to localhost only — nginx on the host terminates TLS on 443.
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    networks:
      - dentalflow_prod_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dentaflow-worker-prod
    restart: always
    env_file:
      - .env.production
    environment:
      DB_HOST: dentaflow-db-prod
    command: ["/bin/sh", "/app/scripts/entrypoint-worker-prod.sh"]
    networks:
      - dentalflow_prod_net
    depends_on:
      db:
        condition: service_healthy
